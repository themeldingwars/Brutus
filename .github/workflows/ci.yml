name: Build, Test & Publish

on:
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-24.04, rid: linux-x64 }
          - { name: Windows, os: windows-2025-vs2026, rid: win-x64 }
          - { name: macOS, os: macos-26, rid: osx-x64 }
        dotnet:
          - { name: .NET 8, version: '8.0.x' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK version
        env:
          DOTNET_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --force
      - name: Verify SDK installation
        run: dotnet --info

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # RID-specific single-file publish needs its own restore per the workspace's existing
      # publish.bat convention, so this doesn't reuse the plain build above.
      - name: Publish
        env:
          RID: ${{ matrix.platform.rid }}
        run: dotnet publish Brutus/Brutus.csproj --configuration Release --runtime "$RID" --self-contained false -p:PublishSingleFile=true --output "Publish/$RID"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brutus-${{ matrix.platform.rid }}
          path: Publish/${{ matrix.platform.rid }}
